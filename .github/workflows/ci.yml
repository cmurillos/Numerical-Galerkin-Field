name: Numerical verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numerical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev]'
      - name: Record environment
        run: python -m pip freeze
      - name: Check source
        run: |
          ruff check .
          ruff format --check .
      - name: Test numerical contracts
        run: python -m pytest --junitxml=test-results.xml
      - name: Run examples
        run: |
          python examples/general_problem.py
          python examples/embedded_torus.py
          python examples/heterogeneous_coefficient.py
          python examples/diffusion.py
          python examples/reaction_diffusion.py
      - name: Exercise benchmark and build distribution
        if: matrix.python-version == '3.12'
        run: |
          python benchmarks/field_evaluation.py --batch-sizes 1 4 --modes 4 --repeats 2 --output outputs/benchmark.json
          python -m build
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
      - name: Upload benchmark and packages
        if: success() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: numerical-galerkin-field-build
          path: |
            dist/*
            outputs/benchmark.json
